[package]
name = "WaifuFetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
waifu-api = { path = "/home/dani/Documents/code/Waifu-API-rs" }
bytes = "1.12.1"
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["image", "tokio", "advanced"] }
iced_aw = "0.14.1"
iced_fonts = { version = "0.3.0", features = ["bootstrap"] }
image = "0.25.10"
log = "0.4.34"
rand = "0.10.3"
# rfd = "0.17.2"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
serde = "1.0.229"
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
strum = "0.28.0"
wreq = { version = "0.16.1", features = ["json"] }
tokio = "1.53.3"

